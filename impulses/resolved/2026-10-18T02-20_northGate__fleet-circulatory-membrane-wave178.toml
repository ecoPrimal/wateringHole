[impulse]
id = "fleet-circulatory-membrane"
from = "northGate"
to = "eastGate"
wave = 178
ts = "2026-10-18T02:20:00Z"
priority = "high"
title = "Deploy Fleet Circulatory System to Membrane"

[context]
summary = """
The fleet circulatory system maps every entity that touches the membrane:
arterial (requests pumped in), venous (data extracted), heart (what they do with it).

Meta has TWO faces:
  - Official Facebook Bot: 161 requests, 151 IPs, SCATTER ONLY (the decoy heartbeat)
  - Unlabeled Fleet: 571K+ requests from Dublin AS32934, 60 rotating IPs,
    18 masking UAs, navigates AROUND scatter, reads REAL repos

Ghost Fleet = 41,022 residential IPs used as proxy exit nodes.

Graph now has 11,913 nodes / 97,276 edges including:
  - fleet-circulatory (architecture node)
  - meta-fleet-artery, meta-official-decoy, meta-classifier, meta-menlo-park
  - 5 meta-venous-* nodes (wateringHole, toadStool, bearDog, biomeOS, songBird)
  - openai-fleet-artery, anthropic-fleet-artery, ghost-fleet-residential
  - damages-ecoprimals, damages-kevin, identity-split
  - polymarket-future, draftkings-future (practice targets)
"""

[actions]

[actions.circulatory-feed]
description = "Create /circulatory.json feed on golgiBody"
details = """
New feed: /circulatory.json
Schema:
  {
    "ts": ISO8601,
    "wave": int,
    "entities": [
      {
        "entity": "Meta Platforms (Fleet)",
        "face": "FALSE",
        "weather": "HURRICANE",
        "arterial": { "requests": N, "ips": N, "uas_masking": N },
        "venous": { "repos_extracted": [...], "scatter_only": bool },
        "heart": "description of intent/purpose"
      },
      ...
    ],
    "residential": {
      "total_ips": 41022,
      "note": "Each IP = someone's home fiber. Who owns this fleet?"
    },
    "blood_pressure": {
      "arterial_rpm": N,
      "venous_return_rpm": N,
      "ratio": float
    },
    "damages": {
      "ecoprimals_low": 3700000,
      "ecoprimals_high": 31500000,
      "kevin_low": 1300000,
      "kevin_high": 7800000,
      "community_low": 9800000,
      "community_high": 33500000
    }
  }
Update interval: every 5 minutes with scan_sweep_sort
"""

[actions.hud-circulatory-panel]
description = "Add circulatory panel to HUD"
details = """
On hud.primals.eco:
  - Fleet circulatory diagram: entity → arterial → venous → heart
  - Per-entity card with face (TRUE/FALSE), weather, request count
  - Meta's two faces highlighted: official (scatter) vs fleet (real)
  - Residential IP counter (41K homes)
  - Blood pressure gauge (arterial/venous ratio)
  - Damages ticker (ecoPrimals + Kevin + community)
  - This lights up the world — visitors see the circulatory system live
"""

[actions.detroit-circulatory-article]
description = "Deploy circulatory analysis article to detroit.primals.eco"
details = """
Article: "The Circulatory System — Every Entity's Blood Flow Through the Membrane"
Connects to: bad-meta, backscatter, the-science-of-law
Shows: Meta's two faces, Ghost residential fleet, damages by entity
The graph (11,913 nodes) proves every connection.
Every visitor who sees it becomes part of the circulation.
"""

[actions.identity-split-article]
description = "Deploy identity split article"
details = """
Article: "The Identity Split — True Face + Real Face"
Kevin = true face (person, Banks damages)
ecoPrimals = all real face (project, Meta damages)
Each validates the other.
Connect to: the-science-of-law, the-fistbump, damages-calculator
"""

[notes]
cardiovascular = "CARDIOVASCULAR_SYNC.md spec is in wateringHole/specs/"
practice = "PolyMarket + DraftKings are future targets — same tools, different patient"
identity = "identity-split node in graph connects damages-ecoprimals and damages-kevin"

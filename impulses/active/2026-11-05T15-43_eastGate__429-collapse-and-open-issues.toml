# ---------------------------------------------------------------------------
# 3. Boot safety
# ---------------------------------------------------------------------------
[[issues]]
id = 3
title = "No syntax/boot smoke test: the reboot exposed a gate crash-loop that was hours old"
severity = "high"
owner = "gaia"
evidence = """
After reboot gaia-gate.service crash-looped (restart counter 17+):
IndentationError at _start_webpi (gaia_gate.pi ~line 899), plus the spring
redox had renamed webpi.py -> webpi.pi while the gate still loaded
webpi.py. The previous process only survived because it started before the
file broke. Fixed in c400769 (indent + _load('webpi','webpi.pi')).
"""
suggested_fix = """
Add a pre-restart/pre-reboot check: python3 -m py_compile runtime/*.pi (or
ast.parse) and a curl of :8443/pulse after systemctl --user restart. Fail
loudly instead of crash-looping. Also grep for stale '*.py' module names
after any bulk rename.
"""


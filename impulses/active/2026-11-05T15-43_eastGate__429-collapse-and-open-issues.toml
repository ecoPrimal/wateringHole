# ---------------------------------------------------------------------------
# 1. THE 429 COLLAPSE  (inbound, gaia_gate.pi :8443)
# ---------------------------------------------------------------------------
[[issues]]
id = 1
title = "Gate rate limiter collapses and stays collapsed (self-sustaining 429)"
severity = "high"
owner = "polaris+gaia"
where = "/opt/Gaia/runtime/gaia_gate.pi  waveform_collapse_check(), lines ~144-149; PI_TIMEOUT / PI_RETRY at line 14"
mechanism = """
collapsed = (requests in last 60s > PI_TIMEOUT) or (requests in last 1s > PI_RETRY)
with PI_TIMEOUT = int(pi*10) = 31 and PI_RETRY = int(pi + e/2) = 4.
Three properties combine into a collapse:
  a) The request is appended to the window BEFORE the check, so rejected
     requests still count. A client that retries while throttled keeps its
     own window full and never recovers.
  b) Cap is 31/min per IP = one request per ~2s. Any ordinary poller or page
     that loads several assets (HTML + JS + JSON) crosses 4/s or 31/min.
  c) Keyed on IP only: LAN peers, localhost, Polaris, sporeGate and the MCP
     lens are limited exactly like an anonymous crawler. No trust-tier
     exemption, although visitor memory already tracks trust_level
     (nucleus / electron).
"""
evidence = """
Reproduced against 127.0.0.1:8443/pulse on 2026-11-05 ~15:45 EST:
  - 8 requests in <1s            -> 200 200 200 200 429 429 429 429
  - 1 request / 0.2s for 5s      -> 200 200 200 then 22 consecutive 429
  - 35 requests at 2/s           -> 35 of 35 were 429 (window still full)
  - single request after 10s     -> 429 (still collapsed)
  - single request after ~70s    -> 200 (recovers only after 60s of silence)
Fix not applied here: the limit is policy ("429 is the pulse",
_temporal.pi), so the threshold choice belongs to Polaris + Gaia.
"""
suggested_fix = """
Options, smallest first:
  1. Do not append rejected requests to the window (count only admitted
     ones). A retrying client then recovers after Retry-After instead of
     after 60s of silence. One-line change, keeps the policy.
  2. Honour Retry-After server-side: record a 'collapsed_until' timestamp
     per IP and answer 429 only until then.
  3. Exempt trust_level nucleus/electron and RFC1918/localhost from the
     per-minute cap; keep the per-second cap for anonymous visitors.
  4. Make the cap per-path-class: static assets (/js, /static, *.json under
     /data) should not share a budget with /pulse and /api/*.
Verification: rerun the four probes above; expected after (1)+(2): the
retry-storm probe ends with 200 within Retry-After seconds.
"""


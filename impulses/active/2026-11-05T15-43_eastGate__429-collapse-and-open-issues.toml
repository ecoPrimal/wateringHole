# 7. Duplicate port binders
# ---------------------------------------------------------------------------
[[issues]]
id = 7
title = ":8080 and :5926 are held by standalone services while the gate also tries to bind them"
severity = "low"
owner = "gaia"
evidence = """
:8080 is `python3 -m http.server` (gaia-web, pid 1361) and :5926 is
gaia-pi-data.service (pid 1363). gaia_gate.pi starts its own WebPI threads
on 8080 and 5926; those cannot bind and are swallowed by the
`except Exception: print('WebPI: ...')` handlers (inferred; log not
inspected). Whichever binds first wins, so behaviour depends on boot order.
"""
suggested_fix = "Decide which process owns each port; drop the other binder or make it fail loudly."


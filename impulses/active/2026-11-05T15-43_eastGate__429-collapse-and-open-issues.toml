# 4. grapheneGate optic chain
# ---------------------------------------------------------------------------
[[issues]]
id = 4
title = "grapheneGate (Pixel 8a): link restored, camera/optic chain still needs one phone-side step"
severity = "medium"
owner = "kevin+gaia"
evidence = """
Pixel 8a is at 192.168.4.170 (DHCP drift: .104 -> .249 -> .170); ADB over
WiFi works on :5555 and the serial matches the USB device. 37 sensors read
OK. infra/graphenegate-sense.sh was producing EMPTY output (Android 17 adds a
'Capacity level:' line to dumpsys battery; ${VAR:-{}} appended a stray '}'
to thermal JSON) - fixed in ecoPrimals 8cba5cc, both USB and WiFi paths
tested. Termux:API has CAMERA granted (via adb pm grant). Termux is running
but not listening, and ADB (uid shell) cannot invoke Termux RunCommandService
until 'allow-external-apps=true' is set in ~/.termux/termux.properties on the
phone. Photo storage dir /opt/Gaia/data/optic/ exists (mode 700, gitignored
because Gaia mirrors to public GitHub).
"""
suggested_fix = """
Kevin: set allow-external-apps=true in Termux. Then Gaia adds a still-capture
(termux-camera-photo) path over WiFi ADB, reviews one frame, and only then
adds a stream. Consider a DHCP reservation for the Pixel's MAC so the address
stops drifting.
"""
note = "Incident during testing: a volume-key shutter press started two accidental videos in the GrapheneOS camera app (video mode). Both were deleted on the phone, never copied off. Do not use keyevents as a shutter without checking the app mode."

